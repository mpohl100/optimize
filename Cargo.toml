[workspace]
resolver = "2"
members = ["alloc", "app", "evol", "gen", "regret", "neural", "matrix", "markov", "utils", "solver"]

[workspace.dependencies]
# Numerical computing
num-traits = "0.2"

# Parallel processing
rayon = "1.11"

# Testing utilities
approx = "0.5"
proptest = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }